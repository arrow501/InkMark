<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InkMark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script type="module">
  import { getStroke } from 'https://esm.sh/perfect-freehand@1.2.2';
  window.getStroke = getStroke;
  window.dispatchEvent(new Event('inkmark:ready'));
</script>
<style>
:root {
  --canvas: #faf9f5;
  --ink: #141413;
  --body: #3d3d3a;
  --muted: #6c6a64;
  --primary: #cc785c;
  --primary-active: #a9583e;
  --hairline: #e6dfd8;
  --surface-card: #efe9de;
  --surface-elevated: #ffffff;
}
[data-theme="dark"] {
  --canvas: #181715;
  --ink: #faf9f5;
  --body: #c9c5bc;
  --muted: #8e8b82;
  --primary: #cc785c;
  --primary-active: #a9583e;
  --hairline: #2a2824;
  --surface-card: #1f1e1b;
  --surface-elevated: #252320;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.7;
  transition: background 0.2s, color 0.2s;
  -webkit-font-smoothing: antialiased;
}
.doc {
  max-width: 720px;
  margin: 0 auto;
  padding: 96px 32px 240px;
  position: relative;
}
#textarea {
  width: 100%;
  min-height: 80vh;
  background: transparent;
  color: var(--body);
  border: none;
  outline: none;
  resize: none;
  font-family: inherit;
  font-size: 16px;
  line-height: 1.7;
  padding: 0;
  display: block;
}
#doc-content { display: none; }
#doc-content h1, #doc-content h2 {
  font-family: 'Cormorant Garamond', Garamond, 'Times New Roman', serif;
  font-weight: 400;
  color: var(--ink);
  letter-spacing: -0.02em;
  margin: 96px 0 24px;
}
#doc-content h1 { font-size: 56px; line-height: 1.05; letter-spacing: -0.03em; }
#doc-content h2 { font-size: 36px; line-height: 1.15; }
#doc-content > :first-child { margin-top: 0; }
#doc-content p { color: var(--body); margin: 0 0 24px; }
#doc-content ul, #doc-content ol { color: var(--body); padding-left: 24px; margin: 0 0 24px; }
#doc-content li { margin-bottom: 6px; }
#doc-content strong { color: var(--ink); font-weight: 500; }
#doc-content em { font-style: italic; }
#doc-content a { color: var(--primary); text-decoration: none; border-bottom: 1px solid currentColor; }
#doc-content code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.88em;
  background: var(--surface-card);
  padding: 2px 6px;
  border-radius: 4px;
}
#doc-content pre {
  font-family: 'JetBrains Mono', monospace;
  background: var(--surface-card);
  padding: 16px 20px;
  border-radius: 8px;
  overflow-x: auto;
  font-size: 14px;
  line-height: 1.6;
  margin: 0 0 24px;
}
#doc-content pre code { background: none; padding: 0; font-size: inherit; }
#doc-content blockquote {
  border-left: 2px solid var(--hairline);
  margin: 0 0 24px;
  padding-left: 24px;
  color: var(--muted);
}
#doc-content hr { border: none; border-top: 1px solid var(--hairline); margin: 48px 0; }

#ink-overlay {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
  display: none;
  overflow: visible;
}
body[data-mode="ink"] #ink-overlay { display: block; pointer-events: auto; touch-action: none; cursor: crosshair; }
body[data-mode="ink"] #textarea { display: none; }
body[data-mode="ink"] #doc-content { display: block; user-select: none; }

#toolbar {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 6px;
  background: var(--canvas);
  border: 1px solid var(--hairline);
  border-radius: 12px;
  z-index: 100;
  font-size: 14px;
  max-width: calc(100vw - 32px);
  flex-wrap: wrap;
  justify-content: center;
}
[data-theme="dark"] #toolbar { background: var(--surface-elevated); }
.tb-btn {
  background: transparent;
  border: none;
  color: var(--ink);
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  line-height: 1;
}
.tb-btn:hover { background: var(--surface-card); }
.tb-btn.active { background: var(--primary); color: #fff; }
.tb-btn.active:hover { background: var(--primary-active); }
.tb-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.tb-divider { width: 1px; height: 20px; background: var(--hairline); margin: 0 4px; }
.tb-counter { font-size: 13px; color: var(--muted); padding: 0 6px; min-width: 70px; text-align: center; }
.tb-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--primary); display: inline-block;
}
.tb-dot.hidden { visibility: hidden; }

#toast {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 20px;
  background: var(--surface-elevated);
  border: 1px solid var(--hairline);
  border-radius: 8px;
  font-size: 14px;
  color: var(--ink);
  z-index: 200;
  display: none;
  max-width: 480px;
}

#orphan-tray {
  position: fixed;
  bottom: 88px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 14px;
  background: var(--surface-elevated);
  border: 1px solid var(--hairline);
  border-radius: 8px;
  font-size: 13px;
  color: var(--muted);
  display: none;
  z-index: 99;
  align-items: center;
  gap: 8px;
}
#orphan-tray.visible { display: inline-flex; }
#orphan-tray button {
  background: none;
  border: none;
  color: var(--primary);
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  padding: 0;
}
#orphan-tray button:hover { color: var(--primary-active); }

input[type="file"] { display: none; }
</style>
</head>
<body data-mode="write">

<div class="doc">
  <textarea id="textarea" spellcheck="false" placeholder="# Title&#10;&#10;Start writing..."></textarea>
  <div id="doc-content"></div>
  <svg id="ink-overlay" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div id="toolbar" role="toolbar" aria-label="InkMark toolbar">
  <button class="tb-btn active" id="btn-write" title="Write mode (Cmd+E)">Write</button>
  <button class="tb-btn" id="btn-ink" title="Ink mode (Cmd+E)">Ink</button>
  <div class="tb-divider"></div>
  <span class="tb-counter" id="ink-counter" hidden>0 strokes</span>
  <button class="tb-btn" id="btn-undo" hidden title="Undo (Cmd+Z)">Undo</button>
  <button class="tb-btn" id="btn-insert-section" title="Insert section">+ Section</button>
  <div class="tb-divider"></div>
  <button class="tb-btn" id="btn-theme" title="Toggle theme">Light</button>
  <button class="tb-btn" id="btn-save" title="Save (Cmd+S)">Save<span class="tb-dot hidden" id="save-dot"></span></button>
  <button class="tb-btn" id="btn-load" title="Load .md">Load</button>
</div>

<div id="orphan-tray" role="status"></div>
<div id="toast" role="alert"></div>
<input type="file" id="file-input" accept=".md,.markdown,text/markdown,text/plain">

<script>
'use strict';

const DEMO = `# InkMark

Markdown notes you can ink directly over. Headings anchor your strokes — when you edit prose, ink rides along.

## How it works

Switch to **Ink** mode in the toolbar. Draw on the page. Switch back to **Write** mode to edit the markdown.

## Try it

Draw something in this section. Then go to Write mode, add a paragraph above. Switch back. Your ink stays anchored here.

\`\`\`ink
{"v":1,"strokes":[]}
\`\`\`
`;

const $ = id => document.getElementById(id);
const ta = $('textarea');
const docContent = $('doc-content');
const overlay = $('ink-overlay');

const state = {
  mode: 'write',
  theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
  strokes: [],
  orphans: [],
  dirty: false,
  drawing: null,
};

function hash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return Math.abs(h).toString(16).padStart(4, '0').slice(0, 4);
}
function slugify(s) {
  return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'h';
}
function headingId(text) {
  return `h-${slugify(text)}-${hash(text)}`;
}

function parseSource(src) {
  const re = /\n?```ink\s*\n([\s\S]*?)\n```\s*$/;
  const m = src.match(re);
  let body = src;
  let ink = { v: 1, strokes: [] };
  if (m) {
    body = src.slice(0, m.index);
    try {
      const parsed = JSON.parse(m[1]);
      if (parsed && Array.isArray(parsed.strokes)) ink = parsed;
    } catch (e) {
      showToast('Ink block JSON is malformed — strokes hidden until fixed');
    }
  }
  return { body, ink };
}

function buildSource(body, strokes) {
  const json = JSON.stringify({ v: 1, strokes });
  const trimmed = body.replace(/\s*$/, '');
  return `${trimmed}\n\n\`\`\`ink\n${json}\n\`\`\`\n`;
}

function syncInkToSource() {
  const { body } = parseSource(ta.value);
  ta.value = buildSource(body, [...state.strokes, ...state.orphans]);
}

function renderMarkdown(body) {
  const html = marked.parse(body, { mangle: false, headerIds: false });
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  tmp.querySelectorAll('h1, h2').forEach(h => {
    h.id = headingId(h.textContent);
  });
  return tmp.innerHTML;
}

function rdp(points, eps) {
  if (points.length < 3) return points.slice();
  let maxD = 0, idx = 0;
  const a = points[0], b = points[points.length - 1];
  for (let i = 1; i < points.length - 1; i++) {
    const d = perpDist(points[i], a, b);
    if (d > maxD) { maxD = d; idx = i; }
  }
  if (maxD > eps) {
    const left = rdp(points.slice(0, idx + 1), eps);
    const right = rdp(points.slice(idx), eps);
    return left.slice(0, -1).concat(right);
  }
  return [a, b];
}
function perpDist(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
  const t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
  const px = a.x + t * dx, py = a.y + t * dy;
  return Math.hypot(p.x - px, p.y - py);
}

function shouldRecord(p, last, prev) {
  if (!last) return true;
  const d = Math.hypot(p.x - last.x, p.y - last.y);
  if (d > 12) return true;
  if (Math.abs((p.pressure ?? 0.5) - (last.pressure ?? 0.5)) > 0.1) return true;
  if (prev) {
    const a1 = Math.atan2(last.y - prev.y, last.x - prev.x);
    const a2 = Math.atan2(p.y - last.y, p.x - last.x);
    let dA = a2 - a1;
    while (dA > Math.PI) dA -= 2 * Math.PI;
    while (dA < -Math.PI) dA += 2 * Math.PI;
    if (Math.abs(dA) > 0.15) return true;
  }
  return false;
}

function findAnchor(yPage) {
  const headings = [...docContent.querySelectorAll('h1, h2')];
  const docTop = docContent.getBoundingClientRect().top;
  let best = null;
  for (const h of headings) {
    const top = h.getBoundingClientRect().top - docTop;
    if (top <= yPage) best = { el: h, top };
    else break;
  }
  if (!best) return null;
  return {
    heading: best.el.textContent.trim(),
    id: best.el.id,
    headingTop: best.top,
    offsetY: yPage - best.top,
  };
}

function finalizeStroke(rawPoints, pointerType) {
  if (rawPoints.length < 2) return null;
  const simple = rdp(rawPoints, 0.8);
  if (simple.length < 2) return null;

  let cy = 0;
  for (const p of simple) cy += p.y;
  cy /= simple.length;

  const anchor = findAnchor(cy);
  if (!anchor) return null;

  const colWidth = docContent.clientWidth;
  const points = simple.map((p, i) => {
    const x = p.x / colWidth;
    const y = p.y - anchor.headingTop;
    let vx = 0, vy = 0;
    if (i < simple.length - 1) {
      const n = simple[i + 1];
      vx = (n.x - p.x) / colWidth;
      vy = n.y - p.y;
    }
    return [
      +x.toFixed(4),
      Math.round(y),
      +vx.toFixed(4),
      Math.round(vy),
      +(p.pressure ?? 0.5).toFixed(2),
    ];
  });

  return {
    anchor: {
      heading: anchor.heading,
      id: anchor.id,
      offsetY: Math.round(anchor.offsetY),
    },
    size: 3,
    pen: pointerType === 'pen',
    points,
  };
}

function strokeToPath(stroke) {
  if (!stroke || !stroke.length) return '';
  const out = [`M ${stroke[0][0].toFixed(2)} ${stroke[0][1].toFixed(2)}`];
  for (let i = 1; i < stroke.length; i++) {
    out.push(`L ${stroke[i][0].toFixed(2)} ${stroke[i][1].toFixed(2)}`);
  }
  out.push('Z');
  return out.join(' ');
}

function renderStrokes() {
  overlay.innerHTML = '';
  const w = docContent.clientWidth;
  const h = Math.max(docContent.scrollHeight, docContent.offsetHeight);
  overlay.setAttribute('width', w);
  overlay.setAttribute('height', h);
  overlay.style.width = w + 'px';
  overlay.style.height = h + 'px';
  overlay.style.left = docContent.offsetLeft + 'px';
  overlay.style.top = docContent.offsetTop + 'px';

  const inkColor = getComputedStyle(document.body).getPropertyValue('--ink').trim() || '#141413';
  const docTop = docContent.getBoundingClientRect().top;

  const stillAnchored = [];
  const newOrphans = [];

  for (const s of [...state.strokes, ...state.orphans]) {
    let hEl = document.getElementById(s.anchor.id);
    if (!hEl) {
      const fuzzy = [...docContent.querySelectorAll('h1, h2')]
        .find(el => el.textContent.trim() === s.anchor.heading.trim());
      if (fuzzy) {
        hEl = fuzzy;
        s.anchor.id = fuzzy.id;
      }
    }
    if (!hEl) {
      newOrphans.push(s);
      continue;
    }
    stillAnchored.push(s);

    const hTop = hEl.getBoundingClientRect().top - docTop;
    const abs = s.points.map(([x, y, , , p]) => ({
      x: x * w,
      y: hTop + y,
      pressure: p,
    }));

    const stroke = window.getStroke(abs, {
      size: 3.2,
      thinning: 0.5,
      smoothing: 0.6,
      streamline: 0.5,
      simulatePressure: !s.pen,
      last: true,
    });

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    if (stroke && stroke.length) {
      path.setAttribute('d', strokeToPath(stroke));
      path.setAttribute('fill', inkColor);
    } else {
      path.setAttribute('d', 'M ' + abs.map(p => `${p.x},${p.y}`).join(' L '));
      path.setAttribute('stroke', inkColor);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke-width', '2');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
    }
    overlay.appendChild(path);
  }

  state.strokes = stillAnchored;
  state.orphans = newOrphans;
  updateOrphanTray();
  updateInkCounter();
}

let liveRaw = [];
let recordedRaw = [];
let livePath = null;

function startStroke(e) {
  if (state.mode !== 'ink') return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  overlay.setPointerCapture(e.pointerId);
  state.drawing = { pointerId: e.pointerId, pointerType: e.pointerType };
  const p = { x: e.offsetX, y: e.offsetY, pressure: e.pressure || 0.5 };
  liveRaw = [p];
  recordedRaw = [p];
  livePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  livePath.setAttribute('fill', getComputedStyle(document.body).getPropertyValue('--ink').trim());
  overlay.appendChild(livePath);
  drawLive();
}

function moveStroke(e) {
  if (!state.drawing || e.pointerId !== state.drawing.pointerId) return;
  e.preventDefault();
  const p = { x: e.offsetX, y: e.offsetY, pressure: e.pressure || 0.5 };
  liveRaw.push(p);
  const last = recordedRaw[recordedRaw.length - 1];
  const prev = recordedRaw[recordedRaw.length - 2];
  if (shouldRecord(p, last, prev)) recordedRaw.push(p);
  drawLive();
}

function drawLive() {
  if (!livePath) return;
  const stroke = window.getStroke(liveRaw, {
    size: 3.2,
    thinning: 0.5,
    smoothing: 0.6,
    streamline: 0.5,
    simulatePressure: state.drawing?.pointerType !== 'pen',
  });
  livePath.setAttribute('d', strokeToPath(stroke));
}

function endStroke(e) {
  if (!state.drawing || e.pointerId !== state.drawing.pointerId) return;
  e.preventDefault();
  const last = { x: e.offsetX, y: e.offsetY, pressure: e.pressure || 0.5 };
  if (recordedRaw[recordedRaw.length - 1] !== last) recordedRaw.push(last);

  const stroke = finalizeStroke(recordedRaw, state.drawing.pointerType);
  state.drawing = null;
  liveRaw = [];
  recordedRaw = [];
  if (livePath) { livePath.remove(); livePath = null; }

  if (stroke) {
    state.strokes.push(stroke);
    markDirty();
    syncInkToSource();
  }
  renderStrokes();
}

function undo() {
  if (!state.strokes.length) return;
  state.strokes.pop();
  markDirty();
  syncInkToSource();
  renderStrokes();
}

function markDirty() {
  state.dirty = true;
  $('save-dot').classList.remove('hidden');
}
function markClean() {
  state.dirty = false;
  $('save-dot').classList.add('hidden');
}

async function setMode(mode) {
  if (mode === state.mode) return;
  state.mode = mode;
  document.body.dataset.mode = mode;
  $('btn-write').classList.toggle('active', mode === 'write');
  $('btn-ink').classList.toggle('active', mode === 'ink');
  toggleHidden($('btn-undo'), mode !== 'ink');
  toggleHidden($('ink-counter'), mode !== 'ink');
  toggleHidden($('btn-insert-section'), mode !== 'write');

  if (mode === 'write') {
    overlay.innerHTML = '';
    updateOrphanTray();
    ta.focus();
  } else {
    const { body, ink } = parseSource(ta.value);
    state.strokes = (ink.strokes || []).filter(s => s.anchor && Array.isArray(s.points));
    state.orphans = [];
    docContent.innerHTML = renderMarkdown(body);
    await document.fonts.ready;
    await new Promise(r => requestAnimationFrame(r));
    renderStrokes();
  }
}

function toggleHidden(el, hidden) {
  if (hidden) el.setAttribute('hidden', '');
  else el.removeAttribute('hidden');
}

function setTheme(t) {
  state.theme = t;
  document.documentElement.dataset.theme = t;
  $('btn-theme').textContent = t === 'dark' ? 'Dark' : 'Light';
  if (state.mode === 'ink') renderStrokes();
}

function updateInkCounter() {
  const n = state.strokes.length;
  $('ink-counter').textContent = `${n} stroke${n === 1 ? '' : 's'}`;
}

function updateOrphanTray() {
  const tray = $('orphan-tray');
  if (state.orphans.length && state.mode === 'ink') {
    const n = state.orphans.length;
    tray.innerHTML = `<span>${n} orphaned stroke${n === 1 ? '' : 's'}</span><button id="orphan-clear">Discard</button>`;
    tray.classList.add('visible');
    $('orphan-clear').onclick = () => {
      state.orphans = [];
      markDirty();
      syncInkToSource();
      renderStrokes();
    };
  } else {
    tray.classList.remove('visible');
  }
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(showToast._tid);
  showToast._tid = setTimeout(() => { t.style.display = 'none'; }, 3500);
}

function saveFile() {
  syncInkToSource();
  const src = ta.value;
  const blob = new Blob([src], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'inkmark.md';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  markClean();
}

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    ta.value = String(reader.result);
    markClean();
    if (state.mode === 'ink') {
      state.mode = 'write';
      await setMode('ink');
    }
  };
  reader.onerror = () => showToast('Could not read file');
  reader.readAsText(file);
}

function insertSection() {
  const pos = ta.selectionStart;
  const before = ta.value.slice(0, pos);
  const after = ta.value.slice(pos);
  const lead = before.length === 0 || before.endsWith('\n\n') ? '' : before.endsWith('\n') ? '\n' : '\n\n';
  const insert = `${lead}## New section\n\n`;
  ta.value = before + insert + after;
  const caret = before.length + lead.length + 3;
  ta.selectionStart = caret;
  ta.selectionEnd = caret + 'New section'.length;
  ta.focus();
  markDirty();
}

function init() {
  ta.value = DEMO;
  setTheme(state.theme);
  document.body.dataset.mode = 'write';
  markClean();

  ta.addEventListener('input', markDirty);

  $('btn-write').onclick = () => setMode('write');
  $('btn-ink').onclick = () => setMode('ink');
  $('btn-theme').onclick = () => setTheme(state.theme === 'dark' ? 'light' : 'dark');
  $('btn-save').onclick = saveFile;
  $('btn-load').onclick = () => $('file-input').click();
  $('file-input').onchange = e => {
    const f = e.target.files[0];
    if (f) loadFile(f);
    e.target.value = '';
  };
  $('btn-undo').onclick = undo;
  $('btn-insert-section').onclick = insertSection;

  overlay.addEventListener('pointerdown', startStroke);
  overlay.addEventListener('pointermove', moveStroke);
  overlay.addEventListener('pointerup', endStroke);
  overlay.addEventListener('pointercancel', endStroke);
  overlay.addEventListener('lostpointercapture', endStroke);

  document.addEventListener('keydown', e => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(); }
    else if (mod && e.key.toLowerCase() === 'e') {
      e.preventDefault();
      setMode(state.mode === 'write' ? 'ink' : 'write');
    } else if (mod && e.key.toLowerCase() === 'z' && state.mode === 'ink') {
      e.preventDefault(); undo();
    }
  });

  let resizeT;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => { if (state.mode === 'ink') renderStrokes(); }, 100);
  });

  window.addEventListener('beforeunload', e => {
    if (state.dirty) { e.preventDefault(); e.returnValue = ''; }
  });
}

if (window.getStroke) init();
else window.addEventListener('inkmark:ready', init, { once: true });
</script>
</body>
</html>
